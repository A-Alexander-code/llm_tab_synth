version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)-8s] %(name)s — %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  brief:
    format: "%(asctime)s [%(levelname)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: brief
    stream: ext://sys.stdout

  file_main:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/run.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf-8

  file_errors:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: standard
    filename: logs/errors.log
    maxBytes: 5242880   
    backupCount: 3
    encoding: utf-8

loggers:
  sampler:
    level: DEBUG
    handlers: [console, file_main, file_errors]
    propagate: false

  evaluator:
    level: DEBUG
    handlers: [console, file_main, file_errors]
    propagate: false

  plotter:
    level: DEBUG
    handlers: [console, file_main, file_errors]
    propagate: false

root:
  level: WARNING
  handlers: [console]